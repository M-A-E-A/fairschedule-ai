version: "3.9"
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fairschedule
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    depends_on:
      - db
    environment:
      # psycopg (v3) is the only PostgreSQL driver installed, so the URL must
      # name it explicitly — a bare postgresql:// URL would try to load
      # psycopg2, which is not installed.
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/fairschedule
      APP_ENV: development
      # The browser's Origin header on cross-origin API calls from the
      # published frontend (http://localhost:5173). "frontend" is a name on
      # the Docker network only — no browser ever sends it.
      BACKEND_CORS_ORIGINS: http://localhost:5173
      AI_PROVIDER: none
      # No JWT_SECRET here: with APP_ENV=development the backend generates an
      # ephemeral per-process secret, so no secret value ships in the repo.
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      # Vite bakes VITE_* variables into the bundle at build time, so the API
      # base URL must be a build argument, not a runtime environment variable.
      args:
        VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  pg_data:
