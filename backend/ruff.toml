# Ruff configuration for the FairSchedule AI backend.
# Run with: ruff check .   (from backend/ — this is the backend `lint` command,
# wired into .github/workflows/ci.yml as the "Backend lint" step).
line-length = 120
target-version = "py312"
src = ["app", "tests"]

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # comprehensions
    "UP",  # pyupgrade
]
ignore = []

[lint.flake8-bugbear]
# B008 flags function calls in argument defaults. FastAPI is deliberately
# designed around `Depends()` / `Security()` / `require_roles()` written in
# parameter defaults — moving those calls into function bodies would break
# dependency injection, not fix anything. Ruff's documented mechanism for
# this exact case is `extend-immutable-calls`, so we declare these three
# call targets as accepted instead of restructuring working endpoints.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Security",
    "app.api.deps.require_roles",
]

[lint.per-file-ignores]
# Test files may import starred fixtures and use assert plainness.
"tests/**" = ["B011"]
