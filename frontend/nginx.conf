# Static server for the built Vite bundle (see frontend/Dockerfile).
# Listening on 5173 keeps the published origin http://localhost:5173, which is
# the origin the backend CORS allowlist expects.
server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The app uses BrowserRouter, so any unknown path is an application route:
    # serve the SPA shell and let the client router resolve it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
